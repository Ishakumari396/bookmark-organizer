<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" , initial-scale="1.0" />
    <title>Bookmark Saver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@400;500;700&family=Roboto:ital,wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="app-container">
        <h1>Bookmark Saver</h1>
        <div class="input-container">
            <input type="text" id="bookmark-name" placeholder="Bookmark Name" />
            <input type="url" id="bookmark-URL" placeholder="Bookmark URL" />
            <button id="bookmark-add">Add Bookmark</button>
        </div>
        <ul id="bookmark-list"></ul>
    </div>
    <script src="index.js"></script>
</body>

</html>
